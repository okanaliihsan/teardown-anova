[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anova-clone"
version = "0.1.0"
description = "Tek yonlu sabit etkili ANOVA omnibus guc analizi - egitim amacli temiz oda yeniden yazimi (YZM301)"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.scripts]
gpower-clone = "anova_clone.cli:console_main"

[tool.setuptools.packages.find]
where = ["src"]
